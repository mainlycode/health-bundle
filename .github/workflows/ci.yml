name: "CI"

on:
  pull_request: # Note: By default, a workflow only runs when a pull_request's activity type is opened, synchronize, or reopened
    branches:
      - "main" # only PRs to main
  push:
    branches:
      - "main" # merge to main assuming main branch is protected
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 1" # weekly, monday 13:37

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: "Tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }} dependencies)"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # https://www.php.net/supported-versions.php
        # https://github.com/shivammathur/setup-php#tada-php-support
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "highest"
        include:
          # Symfony 6.4.0 triggers "implicitly nullable parameter" deprecations on PHP >= 8.4,
          # so the lowest allowed dependencies are only exercised on the lowest supported PHP.
          - php-version: "8.2"
            dependencies: "lowest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2" # installed by default but now explicit
          coverage: "none"
        env:
          fail-fast: true

      - name: "Validate composer.json"
        run: "composer validate --strict --no-interaction --ansi"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependencies }}"

      - name: "Run PHPUnit"
        run: "vendor/bin/phpunit --testdox"

  coverage:
    name: "Code coverage"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          tools: "composer:v2"
          coverage: "pcov"
        env:
          fail-fast: true

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"

      - name: "Run PHPUnit with coverage"
        run: "vendor/bin/phpunit --coverage-text"

  static-analysis:
    name: "Static analysis"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          tools: "composer:v2"
          coverage: "none"
        env:
          fail-fast: true

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"

      - name: "Run PHPStan"
        run: "vendor/bin/phpstan analyse --no-progress --error-format=github"

  security:
    name: "Security audit"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          tools: "composer:v2"
          coverage: "none"
        env:
          fail-fast: true

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"

      - name: "Run Composer audit"
        run: "composer audit --no-interaction --ansi"
